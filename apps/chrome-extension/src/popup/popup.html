<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 { margin: 0 0 4px 0; font-size: 16px; }
    p { margin: 0 0 12px 0; font-size: 12px; color: #94a3b8; }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .notes-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
    }
    .note-item {
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note-item:last-child { border-bottom: none; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h3>🎓 MeetMonitor</h3>
  <p>Student Companion</p>

  <div class="status-card" id="statusCard">
    <div><strong>Active Session:</strong> <span id="sessionStatus">Not connected to a class</span></div>
    <div id="guestNameRow" style="margin-top:4px; display:none;"><strong>Signed in as:</strong> <span id="guestName"></span></div>
  </div>

  <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Your Saved Class Notes</div>
  <div class="notes-list" id="notesList">
    <div style="padding:12px; color:#94a3b8; font-size:11px;">No saved notes yet. Notes taken in class will appear here.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
